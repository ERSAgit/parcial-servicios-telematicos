<VirtualHost *:80>
    ServerName parcial.empresa.local
    DocumentRoot /var/www/parcial
    DirectoryIndex index.html

    <IfModule mod_deflate.c>
        DeflateCompressionLevel 6
        AddOutputFilterByType DEFLATE text/html text/plain text/xml \
            text/css application/javascript application/json image/svg+xml
        SetEnvIfNoCase Request_URI \.(?:gif|jpe?g|png|webp|mp4|avi|zip|gz|pdf)$ \
            no-gzip dont-vary
    </IfModule>

    <IfModule mod_brotli.c>
        BrotliCompressionQuality 11
        AddOutputFilterByType BROTLI_COMPRESS text/html text/plain text/xml \
            text/css application/javascript application/json image/svg+xml
    </IfModule>
</VirtualHost>